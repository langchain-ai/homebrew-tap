name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        # Do not add an x86_64 macOS runner back. homebrew-core's last Intel
        # bottle target is sonoma, so `go` is unbottled anywhere above it and
        # test-bot skips the formula outright — no install, no test, no bottle.
        # Runners here are all arm64. macos-15 is Apple Silicon Sequoia, not
        # the macos-15-intel runner dropped in #42.
        os: [ macos-26, macos-15 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
          - os: ubuntu-24.04-arm
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Test package bump scope validation
        if: matrix.os == 'macos-15'
        run: node --test .github/scripts/package-bump-scope.test.cjs

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae --root-url=https://ghcr.io/v2/langchain-ai/tap
        if: github.event_name == 'pull_request'

      - name: Detect changed casks
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        id: changed-casks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            core.setOutput('open-swe-desktop', files.some((file) => file.filename === 'Casks/open-swe-desktop.rb'));

      - name: Validate Open SWE Desktop cask
        if: steps.changed-casks.outputs.open-swe-desktop == 'true'
        run: |
          brew style --cask langchain-ai/tap/open-swe-desktop
          brew audit --cask --online langchain-ai/tap/open-swe-desktop
          brew fetch --force langchain-ai/tap/open-swe-desktop

      # Audit and fetch never open the DMG, so a bump whose app or binary paths
      # no longer match the release (as when Open SWE.app became Robin.app)
      # would pass them and auto-land. Install it and run every linked command.
      - name: Install Open SWE Desktop cask
        if: steps.changed-casks.outputs.open-swe-desktop == 'true'
        run: |
          cask=langchain-ai/tap/open-swe-desktop
          brew install --cask "$cask"
          info="$(brew info --cask --json=v2 "$cask")"
          version="$(jq -r '.casks[0].version' <<<"$info")"
          commands="$(jq -r '.casks[0].artifacts[] | select(has("binary")) | .target' <<<"$info")"
          test -n "$commands"
          for command in $commands; do
            echo "$command --version"
            test "$("$command" --version)" = "$version"
          done
          brew uninstall --cask "$cask"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
