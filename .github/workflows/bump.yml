name: bump formulae

# Manual fallback, deliberately not scheduled. Upstream repos push their own
# bumps here on tag (see langsmith-cli's publish-binaries.yml `bump-tap` job), so this
# only exists to recover a release whose push failed, and to cover formulae
# with no push wired up. Safe to run at any time: `brew livecheck` opens
# nothing for a formula that is already current.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Newer Homebrew refuses to load formulae from an untrusted third-party
      # tap. Trust is keyed by name, so it holds when the action re-taps below.
      - name: Trust LangChain tap
        run: /home/linuxbrew/.linuxbrew/bin/brew trust --tap langchain-ai/tap

      # Mint a short-lived token for the org-installed langchain-actions-pr-bot
      # App. A PR opened with GITHUB_TOKEN would not trigger the test-bot
      # workflow; an App-authored PR does, so the bottle CI runs on the bump.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      # Runs `brew livecheck`, then `brew bump-formula-pr` to open a PR updating
      # the formula's url + sha256 when a newer release exists. The PR pushes
      # straight to the tap (the App bot has write access and cannot own a
      # fork), with the commit identity Homebrew reads from HOMEBREW_GIT_NAME
      # and HOMEBREW_GIT_EMAIL.
      - name: Open bump PR for langsmith-cli if outdated
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_NAME: "langtions-bot[bot]"
          HOMEBREW_GIT_EMAIL: "261626216+langtions-bot[bot]@users.noreply.github.com"
        run: |
          brew=/home/linuxbrew/.linuxbrew/bin/brew
          formula=langchain-ai/tap/langsmith-cli
          "$brew" tap langchain-ai/tap
          latest=$("$brew" livecheck --formula --quiet --newer-only --json "$formula" | jq -r '.[0].version.latest // empty')
          if [ -z "$latest" ]; then
            echo "$formula is already current"
            exit 0
          fi
          "$brew" bump-formula-pr --no-audit --no-browse --no-fork --version "$latest" "$formula"
