name: bump formulae

# Manual fallback, deliberately not scheduled. Upstream repos push their own
# bumps here on tag (see langsmith-cli's release.yml `bump-tap` job), so this
# only exists to recover a release whose push failed, and to cover formulae
# with no push wired up. Safe to run at any time: `brew livecheck` opens
# nothing for a formula that is already current.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Newer Homebrew refuses to load formulae from an untrusted third-party
      # tap. Trust is keyed by name, so it holds when the action re-taps below.
      - name: Trust LangChain tap
        run: /home/linuxbrew/.linuxbrew/bin/brew trust --tap langchain-ai/tap

      # Mint a short-lived token for the org-installed langchain-actions-pr-bot
      # App. A PR opened with GITHUB_TOKEN would not trigger the test-bot
      # workflow; an App-authored PR does, so the bottle CI runs on the bump.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      # Detects new upstream releases via `brew livecheck` and opens a PR
      # updating the formula's url + sha256.
      - name: Open bump PRs for outdated formulae
        uses: dawidd6/action-homebrew-bump-formula@b12d2bc99c46444125e606142f28200ec71a1214 # v10
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Commit identity for langtions-bot[bot]. Set explicitly so the action
          # skips its GitHub `/user` API call, which app/installation tokens
          # are forbidden from making (it 403s otherwise).
          user_name: "langtions-bot[bot]"
          user_email: "261626216+langtions-bot[bot]@users.noreply.github.com"
          # Push the bump branch directly to the tap rather than forking: the
          # app bot has write access and cannot own a personal fork.
          no_fork: true
          tap: langchain-ai/homebrew-tap
          formula: langsmith-cli
          livecheck: true
