name: update Open SWE cask

on:
  repository_dispatch:
    types:
      - open-swe-desktop-release
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Open SWE desktop release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: update-open-swe-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve and verify release
        id: release
        env:
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          asset="Open-SWE-${version}-arm64.dmg"
          release="$(curl --fail --location --retry 3 "https://api.github.com/repos/langchain-ai/open-swe/releases/tags/${TAG}")"
          test "$(jq -r .draft <<< "$release")" = false
          test "$(jq -r .prerelease <<< "$release")" = false
          url="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' <<< "$release")"
          test -n "$url"
          test "$url" != null
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "$url"
          sha256="$(shasum -a 256 "$RUNNER_TEMP/$asset" | cut -d ' ' -f 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          ruby -e '
            path = "Casks/open-swe.rb"
            cask = File.read(path)
            cask.sub!(/^  version ".*"$/, "  version \"#{ENV.fetch("VERSION")}\"") or abort "version stanza not found"
            cask.sub!(/^  sha256 ".*"$/, "  sha256 \"#{ENV.fetch("SHA256")}\"") or abort "sha256 stanza not found"
            File.write(path, cask)
          '

      - name: Audit cask
        run: brew audit --cask --online Casks/open-swe.rb

      - name: Commit update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Casks/open-swe.rb; then
            echo "open-swe is already at ${VERSION}"
            exit 0
          fi
          git config user.name "langtions-bot[bot]"
          git config user.email "261626216+langtions-bot[bot]@users.noreply.github.com"
          git add Casks/open-swe.rb
          git commit -m "open-swe ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
