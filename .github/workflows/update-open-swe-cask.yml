name: update Open SWE cask

on:
  repository_dispatch:
    types:
      - open-swe-desktop-release
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-open-swe-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Configure git
        uses: Homebrew/actions/git-user-config@61b401267256bb9c047d6d1481b176d5772a0ba7
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: langtions-bot[bot]

      - name: Tap LangChain
        run: |
          brew tap langchain-ai/tap
          brew trust --tap langchain-ai/tap

      - name: Bump Open SWE Desktop
        uses: Homebrew/actions/bump-packages@61b401267256bb9c047d6d1481b176d5772a0ba7
        with:
          token: ${{ steps.app-token.outputs.token }}
          casks: langchain-ai/tap/open-swe-desktop
          fork: false
