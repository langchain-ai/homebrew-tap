name: update Open SWE cask

on:
  repository_dispatch:
    types:
      - open-swe-desktop-release
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-open-swe-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Configure git
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: langtions-bot[bot]

      - name: Tap LangChain
        run: |
          brew tap langchain-ai/tap
          brew trust --tap langchain-ai/tap

      - name: Bump Open SWE Desktop
        uses: Homebrew/actions/bump-packages@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ${{ steps.app-token.outputs.token }}
          casks: langchain-ai/tap/open-swe-desktop
          fork: false
