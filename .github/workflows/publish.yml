name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled

jobs:
  verify:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}
      pr: ${{ steps.verify.outputs.pr }}
    steps:
      - name: Check out trusted validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pull request and bottle run
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { classifyPackageBump } = require('./.github/scripts/package-bump-scope.cjs');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.state !== 'open') throw new Error('pull request is not open');
            if (pr.draft) throw new Error('pull request is still a draft');
            if (pr.base.ref !== 'main') throw new Error(`base is ${pr.base.ref}, not main`);
            if (!pr.labels.some((label) => label.name === 'pr-pull')) {
              throw new Error('pr-pull label is no longer present');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const scope = classifyPackageBump(files.map((file) => file.filename));
            if (scope === null) {
              throw new Error(`pull request has unsupported file scope: ${files.map((file) => file.filename).join(', ')}`);
            }

            const botApproved = pr.user.login === 'langtions-bot[bot]' && context.actor === 'langtions-bot[bot]';
            if (botApproved) {
              if (pr.head.repo === null || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('bot bump head is not in this repository');
              }
            } else {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
                throw new Error(`${context.actor} cannot approve publication`);
              }
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tests.yml',
              event: 'pull_request',
              head_sha: pr.head.sha,
              status: 'completed',
              per_page: 100,
            });
            if (!runs.some((run) => run.conclusion === 'success')) {
              throw new Error(`no successful brew test-bot run for ${pr.head.sha}`);
            }

            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr', String(pr.number));

  pr-pull:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
      pull-requests: write
    steps:
      # Mint a short-lived token for the org-installed langchain-actions-pr-bot
      # App. Used only to push the bottle commit to main below: the bot is an
      # `always` bypass actor on the main ruleset, whereas GITHUB_TOKEN
      # (github-actions[bot]) is not and would be rejected.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # main
        with:
          # Configure git auth with the app token so the push to main below is
          # attributed to langtions-bot (the ruleset bypass actor). git-try-push
          # inherits this auth; passing a token there too sends a second
          # Authorization header and GitHub 400s ("Duplicate header").
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # main

      - name: Confirm verified pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
          PULL_REQUEST: ${{ needs.verify.outputs.pr }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PULL_REQUEST),
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              throw new Error('pull request changed after verification');
            }
            if (!pr.labels.some((label) => label.name === 'pr-pull')) {
              throw new Error('pr-pull label is no longer present');
            }

      # Uploads bottles to ghcr and commits the bottle block to main. NOTE: a
      # NEW formula's ghcr package is created private; an org owner must make it
      # public once before `brew install` can fetch its bottles. See the README
      # "Maintaining" section.
      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          PULL_REQUEST: ${{ needs.verify.outputs.pr }}
          VERIFIED_HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$VERIFIED_HEAD_SHA" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@3cdb78d0f62ad29dd32de765782654f4eedea607 # main
        with:
          branch: main
